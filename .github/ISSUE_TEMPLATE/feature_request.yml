name: Feature request
description: Propose a focused improvement to goal generation, installation, or documentation.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What rough-task or contributor need is not met today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Proposed outcome
      description: Describe the observable behavior using a fictional example.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Primary surface
      options:
        - Measurable end state
        - Transcript-visible proof
        - Constraints or stopping boundary
        - Host selection or activation
        - Clarifying question behavior
        - Installer portability
        - Documentation or examples
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Note simpler workarounds or why the current behavior is insufficient.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and Discussions.
          required: true
        - label: The proposal preserves a single provable goal, explicit constraints, and the user's stopping boundary.
          required: true
