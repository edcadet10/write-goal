<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" role="img" aria-label="write-goal — AI-agnostic goal writing with observable proof.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e14"/>
      <stop offset="1" stop-color="#11161f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4ecca3"/>
      <stop offset="0.55" stop-color="#7fd49b"/>
      <stop offset="1" stop-color="#f5b14e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.80" cy="0.22" r="0.65">
      <stop offset="0" stop-color="#f5b14e" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#f5b14e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.08" cy="0.92" r="0.6">
      <stop offset="0" stop-color="#4ecca3" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#4ecca3" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#glow)"/>
  <rect width="1280" height="320" fill="url(#glow2)"/>

  <rect x="90" y="78" width="120" height="4" rx="2" fill="url(#accent)"/>

  <text x="88" y="186" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="108" font-weight="800" letter-spacing="-4" fill="url(#accent)">write-goal</text>

  <text x="94" y="236" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="30" font-weight="500" fill="#9aa4b2">one measurable goal with observable proof</text>

  <text x="94" y="276" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="17" fill="#9aa4b2">AI-agnostic instructions &#183; a finish line you can verify</text>

  <!-- motif: a target with a verified center — define a finish line, prove you hit it -->
  <g transform="translate(1080,160)">
    <circle r="76" fill="none" stroke="#222b38" stroke-width="3"/>
    <circle r="76" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"
            stroke-dasharray="360 999" transform="rotate(-90)"/>
    <circle r="50" fill="none" stroke="#2a3340" stroke-width="3"/>
    <circle r="26" fill="none" stroke="#2a3340" stroke-width="3"/>
    <path d="M-17,2 l11,13 l25,-31" fill="none" stroke="#4ecca3" stroke-width="7"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
